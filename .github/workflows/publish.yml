name: Publish to pub.dev

# Publishes every package in packages/ that is publishable (i.e. does not set
# `publish_to: none`). Triggered by pushing a version tag such as `v0.1.0`.
#
# One-time setup on pub.dev, for each package: Admin -> Automated publishing ->
# enable "Publish from GitHub Actions", repository `rmayobre/volley`,
# tag pattern `v{{version}}`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Run tests
        run: |
          for dir in packages/*/; do
            if [ -d "${dir}test" ]; then
              echo "::group::Testing ${dir}"
              (cd "$dir" && dart test)
              echo "::endgroup::"
            fi
          done

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev OIDC authentication
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Publish packages
        run: |
          # Dependency order: a package must be published before its dependents.
          for name in volley_api volley volley_workers volley_workers_gen; do
            dir="packages/$name"
            if grep -Eq '^publish_to:\s*none' "$dir/pubspec.yaml"; then
              echo "Skipping $name (publish_to: none)"
              continue
            fi
            echo "::group::Publishing $name"
            (cd "$dir" && dart pub publish --force)
            echo "::endgroup::"
          done
