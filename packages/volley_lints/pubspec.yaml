version: 0.1.0
repository: https://github.com/rmayobre/volley/tree/main/packages/volley_lints
issue_tracker: https://github.com/rmayobre/volley/issues
topics:
  - lints
  - analyzer-plugin
  - concurrency
resolution: workspace

environment:
