name: volley_workers_gen
description: "build_runner code generator for volley_workers: turns @actor, @coroutine, @encodable and @singleton declarations into one .gen.dart file."
version: 0.1.0
repository: https://github.com/rmayobre/volley/tree/main/packages/volley_workers_gen
issue_tracker: https://github.com/rmayobre/volley/issues
topics:
  - codegen
  - build-runner
  - web-workers
  - concurrency
resolution: workspace

environment:
  sdk: "^3.7.0"

dependencies:
  analyzer: ">=13.0.0 <15.0.0"
  build: ^4.0.0
  source_gen: ^4.0.0

dev_dependencies:
  build_runner: ^2.10.0
  build_test: ^3.3.0
  lints: ^6.1.0
  test: ^1.31.1
  volley_api: ^0.1.0
  volley_workers: ^0.1.0
